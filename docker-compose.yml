services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aspfullstackbmad-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Local dev-only placeholder, not a secret (solo portfolio project,
      # no shared/production environment) — see spec-1-1 Design Notes.
      MSSQL_SA_PASSWORD: "Dev_pKCxBtKDCPZ6PFQX_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mssql-data:

name: CI

# Fulfills the CI pipeline item from docs/eng-mgmt/post-mvp-roadmap.md
# ("a CI pipeline running dotnet build/dotnet test on every change... and
# npm run build/npm test alongside it") -- previously logged as a gap, no
# workflow existed before this one.
#
# No deploy job: hosting is a local run + Cloudflare quick tunnel
# (docs/deployment.md, scripts/run-demo.sh), not a cloud target CI can push
# to. An earlier Azure App Service + Azure SQL attempt was abandoned after
# Azure SQL Database provisioning failed (RegionDoesNotAllowProvisioning) in
# multiple regions on the available subscription -- see docs/deployment.md's
# "If you want a real hosted deployment later" section.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Only_Password_Not_Real_2026!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ASPFullStackBMAD;User Id=sa;Password=Ci_Only_Password_Not_Real_2026!;TrustServerCertificate=True"
      Jwt__SigningKey: "ci-only-signing-key-not-used-anywhere-else-2026-safe"
      Jwt__Issuer: "ASPFullStackBMAD"
      Jwt__Audience: "ASPFullStackBMAD"
      Jwt__ExpiryMinutes: "60"
      Cors__FrontendOrigin: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Apply EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update -p src/Infrastructure -s src/Api

      - name: Test
        run: dotnet test --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # also runs tsc -b, so this is the type-check gate too
